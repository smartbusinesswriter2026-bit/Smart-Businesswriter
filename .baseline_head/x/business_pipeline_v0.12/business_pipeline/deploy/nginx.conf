# nginx in front of one workbench instance.
# Put the real host name and certificate paths in place before enabling.
limit_req_zone $binary_remote_addr zone=bp:10m rate=20r/s;

server {
    listen 80;
    server_name workbench.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name workbench.example.edu;

    ssl_certificate     /etc/letsencrypt/live/workbench.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.example.edu/privkey.pem;

    client_max_body_size 8m;          # the app caps ingestion at 5 MB before base64
    proxy_read_timeout 180s;          # a sandboxed computation can take a while
    proxy_send_timeout 180s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        limit_req zone=bp burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
